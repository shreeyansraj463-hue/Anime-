<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Boy Is Going To The Market</title>
  <style>
    :root {
      --sky: #1b2d6b;
      --ink: #101628;
      --moon: #d5e2ff;
      --accent: #e23b4a;
      --practical: #f0c36a;
      --iris: #e7a04a;
      --skin: #f0c2ae;
      --hair: #16141c;
      --sclera: #f6f3ee;
      --line: #e7eefc;
    }
    body {
      margin: 0;
      background: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: var(--line);
      font-family: sans-serif;
    }
    .frame {
      width: 1920px;
      height: 1080px;
      background: var(--sky);
      position: relative;
      overflow: hidden;
    }
    .shot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    /* Shot 1: Establish (0.00-2.50) */
    .shot-1 {
      animation: camera-move-1 2.5s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
    }
    @keyframes camera-move-1 {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }
    
    /* Shot 2: Approach (2.50-5.00) */
    .shot-2 {
      transform: scale(1.06);
    }
    
    /* Shot 3: Sakuga (5.00-9.00) */
    .shot-3 {
      /* Locked camera */
    }
    
    /* Shot 4: Button (9.00-12.00) */
    .shot-4 {
      display: flex;
      align-items: flex-end;
      padding-bottom: 10%;
      padding-left: 33%;
    }
    .dialogue {
      font-size: 32px;
      color: var(--line);
      z-index: 10;
    }
    .fade-to-ink {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--ink);
      opacity: 0;
      animation: fade-out 0.33s linear forwards; /* 8 frames at 24fps */
      animation-delay: 11.66s;
    }
    @keyframes fade-out {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <!-- Scene timeline orchestrator (mockup representation for timing) -->
    
    <!-- 1 · Establish · 0.00–2.50 (60 frames) -->
    <div class="shot shot-1" id="shot1">
       <!-- 3 Drawings, character small -->
    </div>
    
    <!-- 2 · Approach · 2.50–5.00 (60 frames) -->
    <div class="shot shot-2" id="shot2">
       <!-- 3 Drawings, closer -->
    </div>
    
    <!-- 3 · Sakuga · 5.00–9.00 (96 frames) -->
    <div class="shot shot-3" id="shot3">
       <!-- 8 Drawings on ones/twos. Rain/Sparks/Blade on ones. -->
       <!-- Anticipate, play action, smear, settle hold for 12+ frames -->
    </div>
    
    <!-- 4 · Button · 9.00–12.00 (72 frames) -->
    <div class="shot shot-4" id="shot4">
       <!-- Eyes on a third, dialogue in clear bottom third -->
       <div class="dialogue">How beautiful are the sounds of morning birds, clouds and river.</div>
    </div>
    
    <div class="fade-to-ink"></div>
  </div>

  <script>
    // Timing logic to switch shots
    const timeToFrames = (time) => time * 24;
    
    setTimeout(() => {
      document.getElementById('shot1').style.display = 'block';
    }, 0);
    
    setTimeout(() => {
      document.getElementById('shot1').style.display = 'none';
      document.getElementById('shot2').style.display = 'block';
    }, 2500); // 2.5s
    
    setTimeout(() => {
      document.getElementById('shot2').style.display = 'none';
      document.getElementById('shot3').style.display = 'block';
    }, 5000); // 5.0s
    
    setTimeout(() => {
      document.getElementById('shot3').style.display = 'none';
      document.getElementById('shot4').style.display = 'block';
    }, 9000); // 9.0s
  </script>
</body>
</html>
